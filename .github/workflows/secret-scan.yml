# Reusable secret scan (gitleaks, full history of the PR checkout). Call with:
#   uses: YPGOC/.github/.github/workflows/secret-scan.yml@main
name: secret-scan
on:
  workflow_call:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          v=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz" | tar -xz gitleaks
      - name: Scan
        run: ./gitleaks git --redact --no-banner --verbose .
