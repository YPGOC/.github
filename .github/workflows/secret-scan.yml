# Reusable secret scan (gitleaks) over the commits a PR introduces (BASE..HEAD). Historical findings are tracked as security issues, not as PR blockers. Call with:
#   uses: YPGOC/.github/.github/workflows/secret-scan.yml@main
name: secret-scan
on:
  workflow_call:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          v=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz" | tar -xz gitleaks
      - name: Scan commits introduced by this PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: ./gitleaks git --redact --no-banner --verbose --log-opts="${BASE}..${HEAD}" .
