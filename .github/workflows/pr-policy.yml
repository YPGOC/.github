# Reusable PR policy. Call from a repo with:
#   jobs:
#     policy:
#       uses: YPGOC/.github/.github/workflows/pr-policy.yml@main
name: pr-policy
on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label: JSON list or bare string; default self-hosted org runners (private repos). Public repos pass ubuntu-latest (bare string or JSON list).'
        required: false
        type: string
        default: '["self-hosted","ypgoc-ci"]'
permissions:
  contents: read
  pull-requests: read
jobs:
  policy:
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    steps:
      - name: Check PR body
        env:
          BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          fail=0
          # fleet-ops#111: a re-run replays the ORIGINAL event payload, so a body/label fixed afterwards was never seen.
          # Read the live PR; fall back to the payload values above only if the call fails.
          if [ -n "${PR:-}" ] && live=$(gh api "repos/$REPO/pulls/$PR" --jq '[(.body // ""), ([.labels[].name] | join(","))] | @json' 2>/dev/null) \
             && lb=$(printf '%s' "$live" | python3 -c 'import json,sys; b,l=json.load(sys.stdin); print(json.dumps(b)); print(l)' 2>/dev/null); then
            BODY=$(printf '%s' "$lb" | head -n1 | python3 -c 'import json,sys; sys.stdout.write(json.loads(sys.stdin.read()))')
            LABELS=$(printf '%s' "$lb" | tail -n1)
          else
            echo "::warning::could not fetch live PR; using event payload"
          fi
          PART='^Part of #[0-9]+ — Run: ([A-Za-z0-9_.-]+/)?[A-Za-z0-9_.-]+#[0-9]+\.r[0-9]+(-[a-z]|\.A)[0-9]+[[:space:]]*$'
          part=0
          printf '%s' "$BODY" | grep -Eq "$PART" && part=1
          # cross-repo link: 'Part of [YPGOC/]<repo>#N' (issue lives in another org repo); needs its own 'Run:' line below
          XREPO='^Part of (YPGOC/)?[A-Za-z0-9_.-]+#[0-9]+([[:space:]].*)?$'
          XRUN='^Part of (YPGOC/)?[A-Za-z0-9_.-]+#[0-9]+ — Run: ([A-Za-z0-9_.-]+/)?[A-Za-z0-9_.-]+#[0-9]+\.r[0-9]+((-[a-z]|\.A)[0-9]+)?[[:space:]]*$'
          xrepo=0
          printf '%s' "$BODY" | grep -Eq "$XRUN" && part=1
          printf '%s' "$BODY" | grep -Eq "$XREPO" && xrepo=1
          if [ $part = 0 ] && [ $xrepo = 0 ] && ! printf '%s' "$BODY" | grep -Eqi '(^|[^a-z])(closes|fixes|resolves) +([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#[0-9]+'; then
            if ! printf '%s' "$LABELS" | grep -Eq '(^|,)trivial(,|$)'; then
              echo "::error::PR must say 'Closes #N', 'Part of #N — Run: <repo>#N.r<K>-a<n>', 'Part of [YPGOC/]<repo>#N' (cross-repo, plus a Run: line), or carry the 'trivial' label"; fail=1
            fi
          fi
          if [ $part = 0 ] && ! printf '%s' "$BODY" | grep -Eq '^Run: *[^ <]+'; then
            echo "::error::PR body needs a 'Run: <repo>#<issue>.r<n>' line"; fail=1
          fi
          for h in Tests Risk Rollback; do
            if ! printf '%s' "$BODY" | grep -Eq "^## +$h"; then
              echo "::error::PR body needs a '## $h' section"; fail=1
            fi
          done
          exit $fail
